name: Build PitchGuide

# Every push builds Linux (with the unit tests) and Windows. A v* tag also
# creates a draft GitHub release with the installers attached.
#
# No macOS job: an Apple build requires the CoreML vocoder
# (Resources/models/pc_nsf_hifigan.mlmodelc), which is not in the repository.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # JUCE's Linux dependencies, minus WebKit and curl: the project builds
      # with JUCE_WEB_BROWSER=0 and JUCE_USE_CURL=0. patchelf and makeself are
      # for packaging/linux/build_installer.sh.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            patchelf \
            makeself

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DPITCHNET_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package installer
        run: packaging/linux/build_installer.sh build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PitchGuide-Linux
          path: dist/PitchGuide-Linux-x86_64.run
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (DirectML)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Default Windows configuration: DirectML on, which is what the
      # installer script expects to package.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Build installer
        shell: pwsh
        run: |
          $isccPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe",
            "$env:ProgramFiles\Inno Setup*\ISCC.exe")
          $iscc = Get-ChildItem -Path $isccPaths -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem -Path $isccPaths -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc.FullName packaging\windows\PitchGuide.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A self-contained VST3 bundle for copying straight into a VST3 folder:
      # the plug-in finds models in its own Contents/Resources/models when they
      # are not installed under %PROGRAMDATA%.
      - name: Package portable VST3
        shell: pwsh
        run: |
          $bundle = "build/PitchGuidePlugin_artefacts/${{ env.BUILD_TYPE }}/VST3/PitchGuide.vst3"
          if (-not (Test-Path "$bundle/Contents/x86_64-win/onnxruntime.dll")) {
            throw "onnxruntime.dll is missing from $bundle"
          }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item -Recurse -Path $bundle -Destination portable/
          New-Item -ItemType Directory -Force -Path portable/PitchGuide.vst3/Contents/Resources | Out-Null
          Copy-Item -Recurse -Path Resources/models -Destination portable/PitchGuide.vst3/Contents/Resources/models

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PitchGuide-Windows-Installer
          path: Output/PitchGuide_Installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable VST3
        uses: actions/upload-artifact@v4
        with:
          name: PitchGuide-Windows-VST3
          path: portable/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/PitchGuide-Linux/PitchGuide-Linux-x86_64.run release/
          cp artifacts/PitchGuide-Windows-Installer/PitchGuide_Installer.exe release/PitchGuide-Windows-Installer.exe
          (cd artifacts/PitchGuide-Windows-VST3 && zip -r ../../release/PitchGuide-Windows-VST3.zip PitchGuide.vst3)
          ls -la release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
